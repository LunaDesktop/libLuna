name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Zależności systemowe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-dev libxcursor-dev \
            libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --workspace

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  distro:
    needs: build
    uses: LunaDesktop/luna/.github/workflows/distro-packages.yml@main
    with:
      package: "libluna"
      description: "libLuna — tłumaczenia środowiska Luna"
      binaries: ""
      files: |
        crates/libluna-i18n/i18n/*.lang:/usr/share/luna/i18n/:644
        LICENSE:/usr/share/licenses/libluna/LICENSE:644
        README.md:/usr/share/doc/libluna/README.md:644
      build: "cargo build --release --locked --workspace"
      deb_depends: "libc6,libxkbcommon0,libxcursor1,libwayland-client0"
      rpm_depends: "glibc,libxkbcommon,libXcursor,libwayland-client"
      arch_depends: "glibc,libxkbcommon,libxcursor,wayland"
